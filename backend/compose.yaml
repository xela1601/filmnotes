# filmnotes for the home server: PocketBase, the schema migrations and the web app in one image.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose pull && docker compose up -d
#
# The image is built and pushed by the Release/publish workflow on a semver tag. To run something
# that is not tagged yet, build it from a checkout instead:
#
#   build: { context: .., dockerfile: Dockerfile }
#
# The port is bound to 127.0.0.1 on purpose: the existing reverse proxy terminates
# TLS and forwards to it. PocketBase itself must never be exposed directly.

services:
  filmnotes-pb:
    image: ghcr.io/xela1601/filmnotes:latest
    container_name: filmnotes-pb
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - pb_data:/pb/pb_data
    # Uncomment to encrypt the settings table (SMTP/S3 credentials) at rest.
    # PB_ENCRYPTION_KEY must then be exactly 32 characters, or the container will not start.
    # command:
    #   - /pb/pocketbase
    #   - serve
    #   - --http=0.0.0.0:8090
    #   - --dir=/pb/pb_data
    #   - --migrationsDir=/pb/pb_migrations
    #   - --encryptionEnv=PB_ENCRYPTION_KEY

volumes:
  pb_data:
