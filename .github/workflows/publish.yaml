# A semver tag on main becomes an image in the GitHub registry.
#
#   git tag v0.2.0-alpha.0 && git push origin v0.2.0-alpha.0
#     -> ghcr.io/<owner>/filmnotes:0.2.0-alpha.0
#
# Nothing is built before it has earned it: the tag has to be valid semver, it has to sit on main,
# it has to match the version the release produced - and the full checks run again on exactly that
# commit. A tag can be pushed days after the commit was green, and "it was green then" is not the
# same statement as "it is green now".
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0-alpha.0"
        required: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: The tag is publishable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: The tag is semantic versioning
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # The regular expression from semver.org, anchored: 1.2.3, 1.2.3-alpha.0, 1.2.3+build.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::'$tag' is not a semantic version - expected something like v0.2.0 or v0.2.0-alpha.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: The tag sits on main
        run: |
          # HEAD, not GITHUB_SHA: on a workflow_dispatch re-publish GITHUB_SHA is the commit of the
          # branch the run was started from, so it would happily vouch for main while the tag we
          # are about to build sits somewhere else entirely. The checkout above is at the tag.
          tagged=$(git rev-parse HEAD)
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tagged" origin/main; then
            echo "::error::$tagged (the tagged commit) is not an ancestor of main - only what CI has seen gets published"
            exit 1
          fi

      - name: The tag matches the released version
        # Every workspace, not just the app: they are one fixed changesets group, and a manifest
        # left behind means the tag names a version that was never actually released.
        run: node scripts/check-release-version.mjs "${{ steps.version.outputs.version }}"

  checks:
    name: Checks
    needs: verify
    # Explicitly the tagged commit: a manual re-publish is dispatched from a branch, so the
    # default ref would check the branch and vouch for something else entirely.
    uses: ./.github/workflows/checks.yaml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  image:
    name: Build and push
    needs: [verify, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest=auto` gives the moving tag to a real release only - a pre-release must never
          # become what an unsuspecting `docker compose pull` fetches.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=filmnotes
            org.opencontainers.image.description=Per-frame notes for analogue film rolls: PocketBase, the schema migrations and the web app in one image

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "### ghcr.io/${{ github.repository }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "On the server: \`docker compose pull && docker compose up -d\` in \`backend/\`."
          } >> "$GITHUB_STEP_SUMMARY"
