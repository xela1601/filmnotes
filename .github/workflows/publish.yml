# A semver tag on main becomes an image in the GitHub registry.
#
#   git tag v0.2.0-alpha.0 && git push origin v0.2.0-alpha.0
#     -> ghcr.io/<owner>/filmnotes:0.2.0-alpha.0
#
# Three things are checked before anything is built, because a wrong image is worse than no image:
# the tag has to be valid semver, it has to sit on main (which is what CI runs on), and it has to
# match the version the release actually produced.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0-alpha.0"
        required: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: The tag is semantic versioning
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # The regular expression from semver.org, anchored: 1.2.3, 1.2.3-alpha.0, 1.2.3+build.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::'$tag' is not a semantic version - expected something like v0.2.0 or v0.2.0-alpha.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: The tag sits on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::this tag is not an ancestor of main - only what CI has seen gets published"
            exit 1
          fi

      - name: The tag matches the released version
        run: |
          released=$(node -p "require('./apps/mobile/package.json').version")
          if [[ "$released" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::tag says ${{ steps.version.outputs.version }}, the workspaces say $released - run 'npm run release' and commit before tagging"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest=auto` gives the moving tag to a real release only - a pre-release must never
          # become what an unsuspecting `docker compose pull` fetches.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=filmnotes
            org.opencontainers.image.description=Per-frame notes for analogue film rolls: PocketBase, the schema migrations and the web app in one image

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "### ghcr.io/${{ github.repository }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "On the server: \`docker compose pull && docker compose up -d\` in \`backend/\`."
          } >> "$GITHUB_STEP_SUMMARY"
