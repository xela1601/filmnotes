# Everything that must be true before a change lands on main.
#
# The jobs mirror what runs locally (`mise run …`), with the same Node the repository pins in
# mise.toml - one source of truth, so a green CI means the same thing as a green machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: mise run lint
      - name: Formatting
        run: mise run format:check
      - name: Types
        run: mise run typecheck
      - name: Tests
        run: mise run test

  backend:
    name: PocketBase smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: npm ci
      # Fetches the pinned PocketBase binary and drives the real server over REST: the schema, the
      # owner rules, the protected scan files and the payloads the app's own mapping produces.
      - name: Backend integration
        run: mise run test:backend

  bundle:
    name: Web bundle and tour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: npm ci
      # The exported bundle is what catches what unit tests cannot: metro output, the router entry,
      # store hydration, i18n and the presets, all at once. Both runs use jsdom, no browser needed.
      - name: Core scenario (spec §2.1)
        run: mise run check:web
      - name: Guided tour
        run: mise run check:tour

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: npm ci
      # A reminder, not a gate: a pull request that changes nothing a user would notice (tooling,
      # a comment) is allowed to have no changeset, and `continue-on-error` keeps it from blocking.
      - name: Is a changeset waiting?
        run: npx changeset status --since=origin/main
        continue-on-error: true
