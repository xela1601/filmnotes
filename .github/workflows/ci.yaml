# What runs on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yaml

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: npm ci
      # A reminder, not a gate: a pull request that changes nothing a user would notice (tooling,
      # a comment) is allowed to have no changeset, and `continue-on-error` keeps it from blocking.
      - name: Is a changeset waiting?
        run: npx changeset status --since=origin/main
        continue-on-error: true
