# Everything that must be true, callable from anywhere.
#
# CI runs it on every push and pull request; Publish runs it again on the tagged commit before it
# builds an image. Same jobs, same commands as `mise run …` locally - one definition, so "green"
# means the same thing everywhere.
name: Checks

on:
  workflow_call:

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: mise run lint
      - name: Formatting
        run: mise run format:check
      - name: Types
        run: mise run typecheck
      - name: Tests
        run: mise run test

  backend:
    name: PocketBase smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: npm ci
      # Fetches the pinned PocketBase binary and drives the real server over REST: the schema, the
      # owner rules, the protected scan files and the payloads the app's own mapping produces.
      - name: Backend integration
        run: mise run test:backend

  bundle:
    name: Web bundle and tour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: npm ci
      # The exported bundle catches what unit tests cannot: metro output, the router entry, store
      # hydration, i18n and the presets, all at once. Both runs use jsdom, no browser needed.
      - name: Core scenario (spec §2.1)
        run: mise run check:web
      - name: Guided tour
        run: mise run check:tour
