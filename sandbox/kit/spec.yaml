schemaVersion: "2"
kind: mixin
name: filmnotes-dev
displayName: filmnotes development mixin
description: Git identity, tools, network allow-list and agent instructions for developing the filmnotes monorepo inside a Docker Sandbox.

# Both arguments are set by sbxenv.yaml: home from --env-arg, repo from the project directory.
args:
  home:
    required: true
    description: Home directory on the host; the deploy key ~/.ssh/id_filmnotes_deploy lives under it
  repo:
    required: true
    description: Absolute host path of the filmnotes checkout (mounted at the same path)

environment:
  variables:
    EXPO_NO_TELEMETRY: "1"
    NPM_CONFIG_UPDATE_NOTIFIER: "false"
    NPM_CONFIG_FUND: "false"
    FILMNOTES_PB_BIN: /opt/pocketbase/pocketbase
    GIT_EDITOR: "true"
    # Host paths as seen inside the sandbox, for the self-test (sandbox-doctor) and scripts.
    FILMNOTES_REPO: "${{ kit.args.repo }}"
    FILMNOTES_HOST_HOME: "${{ kit.args.home }}"

setup:
  install:
    - command: "command -v unzip >/dev/null && command -v jq >/dev/null && command -v sqlite3 >/dev/null || (apt-get update && apt-get install -y --no-install-recommends unzip zip jq sqlite3 && rm -rf /var/lib/apt/lists/*)"
      user: "0"
      description: System tools (no-op when the filmnotes-sbx template already provides them)
    - command: "test -x /opt/pocketbase/pocketbase || (PB_VERSION=0.40.4; ARCH=$(dpkg --print-architecture); mkdir -p /opt/pocketbase && cd /opt/pocketbase && curl -fsSL -o pb.zip https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_${ARCH}.zip && unzip -o pb.zip pocketbase && rm pb.zip && chmod 755 pocketbase)"
      user: "0"
      description: PocketBase binary for backend integration tests (no-op with the template)
  startup:
    - command:
        [
          "sh",
          "-c",
          "mkdir -p /home/agent/.ssh && chmod 700 /home/agent/.ssh && chmod 600 /home/agent/.ssh/config",
        ]
    # Files from kit/files/home land under /home/agent: the self-test (sandbox-doctor) and the
    # Claude Code status line. Make them executable and register the status line in the
    # sandbox's settings.json; runs on every start, idempotent.
    - command:
        - sh
        - -c
        - |
          chmod 0755 /home/agent/.local/bin/sandbox-doctor /home/agent/.claude/statusline.sh 2>/dev/null || true
          f=/home/agent/.claude/settings.json
          [ -s "$f" ] || echo '{}' > "$f"
          tmp=$(mktemp)
          jq '.statusLine = {type: "command", command: "~/.claude/statusline.sh", padding: 1}' "$f" > "$tmp" && mv "$tmp" "$f"
      description: Self-test and status line
  files:
    # Mirrors ~/.gitconfig-github-xela1601 on the host. No GPG signing in the sandbox: the private key stays on the host.
    - path: /home/agent/.gitconfig
      onlyIfMissing: false
      content: |
        [user]
        	name = Alexander Schreiner
        	email = github@alexander-schreiner.de
        [commit]
        	gpgsign = false
        [init]
        	defaultBranch = main
        [pull]
        	rebase = true
        [push]
        	autoSetupRemote = true
        [core]
        	autocrlf = input
        [safe]
        	directory = *
    # GitHub through the repository's own deploy key, which sbxenv.yaml mounts read-only at its
    # host path. Scoped to xela1601/filmnotes alone - see docs/tickets/T-019.
    - path: /home/agent/.ssh/config
      onlyIfMissing: false
      content: |
        Host github-xela1601 github.com
            HostName github.com
            User git
            IdentityFile ${{ kit.args.home }}/.ssh/id_filmnotes_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new

permissions:
  network:
    allow:
      - registry.npmjs.org
      - registry.yarnpkg.com
      - github.com
      - api.github.com
      - "*.githubusercontent.com"
      - codeload.github.com
      - api.expo.dev
      - exp.host
      - "*.expo.dev"
      - nodejs.org
      - deb.debian.org
      - ports.ubuntu.com # arm64 (Apple Silicon)
      - archive.ubuntu.com # amd64
      - security.ubuntu.com
      - security.debian.org
      - mise.jdx.dev
      - cdn.playwright.dev
agentInstructions:
  content: |
    ## filmnotes sandbox

    You are running inside a Docker Sandbox for the `filmnotes` monorepo (analogue photography notes app).
    - Start by reading `docs/HANDOFF.md`, then the spec and `docs/tickets/README.md`.
    - Git identity is preconfigured (~/.gitconfig). Commits are NOT GPG-signed in the sandbox; the owner
      signs on the host. Never change ~/.gitconfig.
    - Pushing to GitHub uses the read-only mounted deploy key (host alias `github-xela1601`). Only push when asked.
    - `docker` is not available. The PocketBase binary is at `$FILMNOTES_PB_BIN` for backend tests.
    - Node/npm are provided by the image; use the project-local npm cache (`.npmrc`).
    - Ports 8081 (Expo web/Metro) and 8090 (PocketBase) are published to the host; the host side of
      8081 is chosen at creation (argument expoPort, default 8082), so tell the owner the sandbox port.
