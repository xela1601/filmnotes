# mise-en-place (https://mise.jdx.dev) – CLI tooling and task runner for filmnotes.
#
# Host:    install mise, then `mise install` and `mise run test`.
# Sandbox: use the wrapper `sandbox/mise` ($HOME is read-only and HTTP needs the
#          sandbox proxy) – e.g. `sandbox/mise run test`.

[tools]
node = "22"

[env]
# npm keeps its cache inside the repo (see .npmrc), never in the read-only $HOME.
EXPO_NO_TELEMETRY = "1"

[tasks.install]
description = "Install all workspace dependencies"
run = "npm install"

[tasks.test]
description = "Run the Jest suites of every workspace"
run = "npm test"

[tasks."test:backend"]
description = "PocketBase integration smoke test (needs backend/bin/pocketbase)"
run = "npm run fetch-pb -w @filmnotes/backend && npm test -w @filmnotes/backend"

[tasks."test:all"]
description = "Every suite: workspaces (jest) plus the backend smoke test"
depends = ["test", "test:backend"]

[tasks."check:web"]
description = "Export the web build and walk the core scenario through it (spec 2.1)"
run = [
  "npx expo export --platform web",
  "node e2e/web-walkthrough.mjs",
]
dir = "apps/mobile"

[tasks.lint]
description = "ESLint over every workspace"
run = "npm run lint"

[tasks.format]
description = "Format the repository with Prettier"
run = "npm run format"

[tasks."format:check"]
description = "Fail if anything is not Prettier-formatted"
run = "npm run format:check"

[tasks.changeset]
description = "Write a changeset for what you just changed"
run = "npx changeset"

[tasks."changeset:status"]
description = "What is waiting for the next release"
run = "npx changeset status --since=main"

[tasks.release]
description = "Apply the changesets: versions, changelogs, app.json"
run = "npm run release"

[tasks.typecheck]
description = "TypeScript: project references plus the Expo app (no emit of stale output)"
run = "npm run typecheck"

[tasks."check:tour"]
description = "Dry-run the screenshot tour in jsdom (no browser needed)"
run = [
  "npx expo export --platform web",
  "node e2e/tour-jsdom.mjs",
]
dir = "apps/mobile"

[tasks.screenshots]
description = "Screenshots of the guided tour (needs a real browser, see e2e/screenshots.mjs)"
run = [
  "npx expo export --platform web",
  "node e2e/screenshots.mjs",
]
dir = "apps/mobile"

[tasks.import]
description = "Import scans for a roll from the desktop (see tools/scan-import/README.md)"
run = "npm run import -w @filmnotes/scan-import --"

[tasks.web]
description = "Start the Expo app for the web (port 8081, published to the host)"
run = "npx expo start --web --port 8081"
dir = "apps/mobile"

[tasks.backend]
description = "Run PocketBase locally (port 8090, published to the host)"
run = "backend/scripts/serve.sh"
